<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Annual Tech Conferences 2025</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-200 flex flex-col items-center justify-center min-h-screen">

    <header class="bg-gray-800 text-white text-center py-4 w-full">
        <h1 class="text-2xl">
            🌸 Exciting Event Coming Soon 🌸
        </h1>
    </header>


    
    <div class="bg-transaparent p-8 rounded-lg  text-center w-11/12 md:w-2/3 lg:w-1/2 mb-6">
        <h1 class="text-4xl font-extrabold text-gray-900 mb-4">Annual Tech Conferences 2025</h1>
        <p class="text-lg text-gray-700 mb-2">📍 <span class="font-semibold">Location: Grand Convention Center, New York</span></p>
        <p class="text-lg text-gray-700 mb-4">📅 <span class="font-semibold">Date: March 20, 2025</span></p>
        <p class="text-gray-600 mb-6">Join us for an exciting event featuring tech, networking, and innovation showcases.</p>
        <div id="countdown" class="text-2xl font-bold text-gray-800"></div>
    </div>

    <div class="bg-white p-8 rounded-lg shadow-lg text-center w-11/12 md:w-2/3 lg:w-1/2">
        <h2 class="text-2xl font-bold mb-4">Register Now</h2>
        <form>
            <div class="mb-4 text-left">
                <label for="name" class="block text-gray-700 text-sm font-bold mb-2"></label>
                <input type="text" id="name" name="name" placeholder="Your Name" 
                    class="shadow-sm border rounded-lg w-full py-3 px-4 text-gray-700 leading-tight focus:outline-none focus:ring-2 focus:ring-blue-500" required>
            </div>
            <div class="mb-4 text-left">
                <label for="email" class="block text-gray-700 text-sm font-bold mb-2"></label>
                <input type="email" id="email" name="email" placeholder="Your Email" 
                    class="shadow-sm border rounded-lg w-full py-3 px-4 text-gray-700 leading-tight focus:outline-none focus:ring-2 focus:ring-blue-500" required>
            </div>
            <button type="submit" class="bg-blue-500 hover:bg-blue-600 text-white font-bold py-3 px-6 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                Register
            </button>
        </form>
    </div>

    <footer class="bg-black text-white text-center py-4 mt-6 w-full">
        <p>&copy; <span id="year"></span> Tech Conferences. All Rights Reserved.</p>
    </footer>

    <script>
        document.getElementById("countdown").innerHTML = "10d 12h 30m 45s";
        document.getElementById("year").innerText = new Date().getFullYear();
    </script>

</body>
</html>
