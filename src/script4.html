<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Word Count</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #333; /* Dark background color */
            color: #fff; /* Light text color for contrast */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #444; /* Slightly lighter dark color for container */
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            width: 80%;
            max-width: 600px;
        }
        textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 16px;
            resize: none;
            background-color: #555; /* Dark background for textarea */
            color: #fff; /* Light text color for textarea */
        }
        #wordCount {
            margin-top: 10px;
            font-weight: bold;
            text-align: right;
        }
    </style>
</head>
<body>
    <div class="container">
        <textarea id="textInput" rows="10" cols="50" placeholder="Type your text here..."></textarea>
        <div id="wordCount">Word Count: 0</div>
    </div>

    <script>
        const textInput = document.getElementById('textInput');
        const wordCount = document.getElementById('wordCount');

        textInput.addEventListener('input', () => {
            const text = textInput.value.trim();
            const words = text.split(/\s+/).filter(word => word.length > 0);
            wordCount.textContent = `Word Count: ${words.length}`;
        });
    </script>
</body>
</html>
